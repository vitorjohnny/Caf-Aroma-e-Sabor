<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Café - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Login</h1>
      <p>Entre no sistema para gerenciar o almoxarifado da cafeteria.</p>
      <form action="principal.html">
        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" placeholder="Digite seu usuário" />

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha" />

        <button type="submit">Entrar</button>
        <p class="note">Este protótipo exibe apenas a interface. Não há autenticação real.</p>
      </form>
    </div>
  </div>
</body>
</html>
